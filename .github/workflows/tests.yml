name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run migrations
        run: npm run db:migrate
        env:
          PGLITE_DATA_DIR: .tmp/pglite-ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
