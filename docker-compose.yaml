services:
  zes-agent-hub:
    build: .
    ports:
      - "8765:8765"
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["node", "server/index.js"]

  # Optional: bolt.diy / zes-builder frontend
  # Uncomment if running bolt.diy alongside zes-agent-hub
  # bolt-diy:
  #   image: stackblitzlabs/bolt.diy:latest
  #   ports:
  #     - "5173:5173"
  #   env_file:
  #     - .env
  #   restart: unless-stopped
